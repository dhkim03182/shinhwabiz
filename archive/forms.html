    <style>

        /* =========================================
           자료실 페이지
        ========================================= */

        .archive-page {
            width: 1200px;
            margin: 0 auto 80px;

            display: flex;
            gap: 60px;
        }


        /* =========================================
           왼쪽 메뉴
        ========================================= */

        .archive-side {
            width: 220px;
            flex-shrink: 0;
        }

        .archive-side h2 {
            font-size: 22px;
            margin-bottom: 20px;
            padding-bottom: 15px;

            border-bottom: 2px solid #1d4f91;
        }

        .archive-side ul {
            border-top: 1px solid #ddd;
        }

        .archive-side li {
            border-bottom: 1px solid #ddd;
        }

        .archive-side a {
            display: block;

            padding: 15px 18px;

            font-size: 15px;
            color: #555;

            transition: 0.2s;
        }

        .archive-side a:hover,
        .archive-side .active a {
            background-color: #1d4f91;
            color: white;
        }


        /* =========================================
           오른쪽 내용
        ========================================= */

        .archive-content {
            flex: 1;
            min-width: 0;
        }


        .archive-title {
            margin-bottom: 35px;
        }

        .archive-title h2 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .archive-title span {
            color: #1d4f91;
            font-size: 14px;
        }

        .archive-title p {
            margin-top: 15px;
            color: #666;
            font-size: 15px;
        }


        /* =========================================
           서식 게시판
        ========================================= */

        .forms-table {
            width: 100%;

            border-collapse: collapse;

            border-top: 2px solid #1d4f91;

            background-color: white;
        }


        .forms-table th {
            padding: 17px 10px;

            background-color: #f5f7fa;

            border-bottom: 1px solid #ddd;

            font-size: 14px;
        }


        .forms-table td {
            padding: 17px 10px;

            border-bottom: 1px solid #e5e7eb;

            text-align: center;

            font-size: 14px;

            color: #555;
        }


        .forms-table td.title {
            text-align: left;
        }


        .forms-table td.title a:hover {
            color: #1d4f91;
        }


        /* 다운로드 */

        .download-btn {
            display: inline-block;

            padding: 6px 12px;

            border: 1px solid #1d4f91;

            color: #1d4f91;

            font-size: 12px;

            transition: 0.2s;
        }


        .download-btn:hover {
            background-color: #1d4f91;

            color: white;
        }


        /* =========================================
           페이지 번호
        ========================================= */

        .pagination {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 5px;
        }


        .pagination a {
            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: 1px solid #ddd;

            background-color: white;

            font-size: 13px;

            color: #555;
        }


        .pagination a:hover,
        .pagination .active {
            background-color: #1d4f91;

            border-color: #1d4f91;

            color: white;
        }


        /* =========================================
           반응형
        ========================================= */

        @media (max-width: 1250px) {

            .archive-page {
                width: 90%;
            }

        }


        @media (max-width: 768px) {

            .archive-page {
                width: 90%;

                flex-direction: column;

                gap: 40px;
            }

            .archive-side {
                width: 100%;
            }

            .forms-table th:nth-child(3),
            .forms-table td:nth-child(3) {
                display: none;
            }

        }

    </style>

</head>
